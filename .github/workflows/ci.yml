name: Standalone dummyplug
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo test
      - run: cargo clippy -- -D warnings
      - run: cargo build
      - run: python -m pip install openai
      - run: |
          target/debug/dummyplug &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9998/healthz >/dev/null; then break; fi
            sleep 0.25
          done
          python tests/http_conformance.py
          python tests/sdk_conformance.py
